
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 9</title>
</head>
<body>
    <form action="mailton:seu.email.@seuemail.com" method="post"></form>
    <table border="1">
        
        <thead>Formulario</thead>
        <tbody>
           <tr>
                <td>Nome</td>
                 <td>
                    <input type="text" name="nome-usuario" id="nome-usuario" size="40" placeholder="Digite seu nome">
                </td>
           </tr>
           <tr>
                <td>E-mail pessoal:</td>
                <td>
                    <input type="text" name="email-pessoal-usuario" id="email-pessoal-usuario" size="40">
                </td>
           </tr>
           <tr>
                <td>E-mail(patter)</td>
                <td>
                    <input type="text" name="email-patter-usuario" id="email-patter-usuario" size="40" placeholder="Digite seu email com @">
                </td>
           </tr>
           <tr>
                <td>Senha</td>
                <td>
                    <input type="text" name="senha-usuario" id="senha-usuario" size="40">
                </td>
           </tr>
           <tr>
                <td>Idade</td>
                <td>
                    <input type="text" name="idade-usuario" id="idade-usuario" size="20">
                </td>
           </tr>
           <tr>
               <td colspan="2">
                   Deixe um comentário
                   <br>
                   <textarea name="comentario" cols="50" rows="10" placeholder="Escreva um texto"></textarea>
                </td>       
           </tr>
           <tr>
                <td>
                    <label for="">Material de interesse: </label>
                    <br>
                    <input type="checkbox" name="beckend" id="backend">BackEnd
                    <br>
                    <input type="checkbox" name="frontend" id="frontend">FrontEnd
                    <br>
                    <input type="checkbox" name="fullstack" id="fullstack">FullStack
                </td>
                <td>
                    <label for="">Tipo de viagem: </label>
                    <br>
                    <input type="radio" id="opcao" name="opcao" value="no">Negócio
                    <br>
                    <input type="radio" id="opcao" name="opcao" value="no">Lazer
                    <br>
                    <input type="radio" id="opcao" name="opcao" value="no">Turismo
                    <br>
                    <input type="radio" id="opcao" name="opcao" value="no">Acadêmico
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Região de interesse: </label>
                    <select name="locais" id="locais" size="4" multiple>
                        <option value=""selecionar>Selecionar</option>
                        <option value="futebol">Futebol</option>
                        <option value="basquete">Basquete</option>
                        <option value="volei">Volei</option>
                        <option value="tenis">Tenis</option>
                    </select>
                </td>
                <td>
                    <label for="">Investimentos </label>:
                    <select name="investimentos" size=11>
                        <option value=""></option>
                        <option value="poupanca" selected>Poupança</option>
                        <option value="cdb" selected>CDB</option>
                        <option value="tesouro_direto" selected>Tesouro Direto</option>
                        <option value="" ></option>
                        <option value="fundos_imobiliarios" selected>Fundos Imobiliários</option>
                        <option value="cdi" selected>CDI</option>
                        <option value="debentures" selected>DEBÊNTURES</option>
                        <option value=""></option>
                        <option value="criptomoedas" selected>Criptomoed as</option>
                        <option value="acoes" selected>Ações</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Escolha uma cor:</label>
                    <input type="color">
                </td>
                <td>
                    <label for="">Selecione um arquivo</label>
                   <input type="file" name="myfile">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <label for="">Data e Hora envio:</label>
                    <input type="datetime-local">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="button"Excluir value="Enviar">
                </td>
                <td>
                    <input type="button" value="Limpar">
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
