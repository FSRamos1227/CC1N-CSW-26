<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <header>
      <a class="logo" href="../index.html">
        <img class="logo_house" src="../img/home_icon.png" alt="casa" />
      </a>
      <nav>
        <ul class="nav_links">
          <li><a href="./servicos.html">Servicos</a></li>
          <li><a href="./curriculo.html">Currículo</a></li>
          <li><a href="./gitHub.html">Git Hub</a></li>
        </ul>
      </nav>
      <a href="./contato.html"><button>Contato</button></a>
    </header>
    <main class="form_container">
      <form>
        <h1>Entre em Contato comigo:</h1>
        <br />

        <table border="1" class="form_table">
          <tr>
            <td>
              <label>
                Nome Completo:
                <input type="text" name="nome" />
              </label>
            </td>

            <td>
              <label>
                Telefone:
                <input type="text" name="telefone" />
              </label>
            </td>
          </tr>

          <tr>
            <td>
              <label>
                <input type="radio" name="tipo_pessoa" value="fisica" />
                Pessoa Física
              </label>

              <label>
                <input type="radio" name="tipo_pessoa" value="juridica" />
                Pessoa Jurídica
              </label>
            </td>

            <td>
              <label>
                CPF/CNPJ:
                <input type="text" name="cpf" />
              </label>
            </td>
          </tr>

          <tr>
            <td>
              <label>Serviço:</label>
              <select name="servico">
                <option style="color: #1e1f22">Selecionar</option>
                <option style="color: #1e1f22">Página estática</option>
                <option style="color: #1e1f22">Página dinâmica</option>
                <option style="color: #1e1f22">Site avançado</option>
              </select>
            </td>

            <td>
              <label>
                Melhor horário para contato:
                <input type="time" name="horario" />
              </label>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <label>Descrição:</label><br />
              <textarea
                class="descricao"
                name="descricao"
                rows="6"
                cols="70"
                placeholder="Digite a descrição do serviço"
              ></textarea>
            </td>
          </tr>

          <tr>
            <td colspan="2" class="botoes">
              <button type="reset">Limpar</button>
              <button type="submit">Enviar</button>
            </td>
          </tr>
        </table>
      </form>
    </main>

    <footer>
      <h4 class="contrato_footer">Contato</h4>

      <p style="margin-bottom: 1vh">Email: silvaramosfilipe314@gmail.com</p>
      <p style="margin-bottom: 1vh">
        <a href="https://github.com/FSRamos1227" target="_blank">
          <img src="../img/github.png" alt="GitHub" width="20" />
          Meu GitHub
        </a>
      </p>
    </footer>
  </body>
</html>
